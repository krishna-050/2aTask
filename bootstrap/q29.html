<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collapsible Sidebar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { overflow-x: hidden; }

        #sidebar {
            width: 240px;
            min-height: 100vh;
            background-color: #1e2a38;
            transition: width 0.3s ease;
            overflow: hidden;
            white-space: nowrap;
        }

        #sidebar.collapsed { width: 60px; }

        #sidebar .brand {
            color: white;
            font-size: 1.1rem;
            padding: 16px;
            border-bottom: 1px solid #2e3f52;
        }

        #sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #adb5bd;
            text-decoration: none;
            padding: 12px 16px;
            font-size: 0.95rem;
        }

        #sidebar a:hover, #sidebar a.active {
            background-color: #0d6efd;
            color: white;
        }

        #sidebar a i { font-size: 1.2rem; min-width: 24px; }

        #sidebar .link-text { transition: opacity 0.2s; }
        #sidebar.collapsed .link-text { opacity: 0; }
        #sidebar.collapsed .brand-text { display: none; }

        #toggleBtn { cursor: pointer; }

        #main { transition: margin-left 0.3s ease; }
    </style>
</head>
<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="brand d-flex align-items-center justify-content-between">
            <span class="brand-text fw-bold">MyApp</span>
            <i class="bi bi-list text-white fs-4" id="toggleBtn"></i>
        </div>
        <a href="#" class="active"><i class="bi bi-speedometer2"></i><span class="link-text">Dashboard</span></a>
        <a href="#"><i class="bi bi-people"></i><span class="link-text">Users</span></a>
        <a href="#"><i class="bi bi-box-seam"></i><span class="link-text">Products</span></a>
        <a href="#"><i class="bi bi-bar-chart"></i><span class="link-text">Analytics</span></a>
        <a href="#"><i class="bi bi-envelope"></i><span class="link-text">Messages</span></a>
        <a href="#"><i class="bi bi-gear"></i><span class="link-text">Settings</span></a>
        <a href="#"><i class="bi bi-box-arrow-left"></i><span class="link-text">Logout</span></a>
    </div>

    <!-- Main Content -->
    <div id="main" class="flex-grow-1">

        <!-- Topbar -->
        <nav class="navbar navbar-light bg-white border-bottom px-4">
            <span class="navbar-brand fw-bold">Dashboard</span>
            <div class="d-flex align-items-center gap-3">
                <i class="bi bi-bell fs-5"></i>
                <img src="https://i.pravatar.cc/35" class="rounded-circle" alt="User">
            </div>
        </nav>

        <!-- Page Content -->
        <div class="container-fluid p-4">
            <h5>Welcome Back! 👋</h5>
            <p class="text-muted">Click the <strong>☰</strong> icon in the sidebar to collapse/expand it.</p>

            <div class="row g-3 mt-2">
                <div class="col-md-4">
                    <div class="card p-3 border-start border-primary border-4">
                        <div class="text-muted small">Total Users</div>
                        <div class="fs-4 fw-bold">1,240</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 border-start border-success border-4">
                        <div class="text-muted small">Revenue</div>
                        <div class="fs-4 fw-bold">$8,540</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 border-start border-danger border-4">
                        <div class="text-muted small">Pending</div>
                        <div class="fs-4 fw-bold">18</div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('toggleBtn').addEventListener('click', function () {
        document.getElementById('sidebar').classList.toggle('collapsed');
    });
</script>
</body>
</html>
