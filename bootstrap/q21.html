<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Website Navbar</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        /* College Logo */
        .college-logo {
            font-size: 24px;
            font-weight: bold;
        }

        /* Navbar links */
        .navbar-nav .nav-link {
            margin: 0 8px;
        }

        /* Hero section */
        .hero {
            min-height: 400px;
            align-items: center;
             display: flex; 
            justify-content: center; 
             text-align: center;
            background-color: #f1f5f9;
        }

        .hero h1 {
            font-size: 42px;
            font-weight: bold;
        }

        .hero p {
            font-size: 18px;
            color: #555;
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <!-- College Logo -->
            <a class="navbar-brand college-logo" href="#">
                ABC College
            </a>

            <!-- Mobile Hamburger Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collegeNavbar"
                aria-controls="collegeNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Navbar Links -->
            <div class="collapse navbar-collapse" id="collegeNavbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Courses
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Admissions
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Faculty
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ================= HERO SECTION ================= -->

    <section class="hero">

        <div>
            <h1>Welcome to ABC College</h1>

            <p>
                Quality Education for a Better Future
            </p>

            <button class="btn btn-primary">
                Explore Courses
            </button>
        </div>

    </section>


    <!-- Bootstrap 5 JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
