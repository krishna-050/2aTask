<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { overflow-x: hidden; }
        #sidebar {
            min-height: 100vh;
            background-color: #212529;
            width: 220px;
        }
        #sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 10px 16px; }
        #sidebar a:hover, #sidebar a.active { background-color: #0d6efd; color: white; }
        #sidebar .brand { color: white; font-size: 1.2rem; padding: 16px; border-bottom: 1px solid #444; }
        .stat-card { border-left: 4px solid; }
    </style>
</head>
<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="brand fw-bold">⚙ AdminPanel</div>
        <a href="#" class="active">🏠 Dashboard</a>
        <a href="#">👤 Users</a>
        <a href="#">📦 Products</a>
        <a href="#">📊 Reports</a>
        <a href="#">⚙ Settings</a>
        <a href="#">🚪 Logout</a>
    </div>

    <!-- Main Content -->
    <div class="flex-grow-1">

        <!-- Top Navbar -->
        <nav class="navbar navbar-light bg-white border-bottom px-4">
            <span class="navbar-brand fw-bold">Dashboard</span>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-danger">3 Alerts</span>
                <img src="https://i.pravatar.cc/35" class="rounded-circle" alt="Admin">
            </div>
        </nav>

        <!-- Dashboard Body -->
        <div class="container-fluid p-4">

            <!-- Stat Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card stat-card border-primary p-3">
                        <div class="text-muted small">Total Users</div>
                        <div class="fs-4 fw-bold">1,240</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card border-success p-3">
                        <div class="text-muted small">Revenue</div>
                        <div class="fs-4 fw-bold">$8,540</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card border-warning p-3">
                        <div class="text-muted small">Orders</div>
                        <div class="fs-4 fw-bold">320</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card border-danger p-3">
                        <div class="text-muted small">Pending</div>
                        <div class="fs-4 fw-bold">18</div>
                    </div>
                </div>
            </div>

            <!-- Recent Orders Table -->
            <div class="card">
                <div class="card-header fw-bold">Recent Orders</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th><th>Customer</th><th>Product</th><th>Amount</th><th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td>1</td><td>Alice</td><td>Laptop</td><td>$999</td><td><span class="badge bg-success">Delivered</span></td></tr>
                            <tr><td>2</td><td>Bob</td><td>Phone</td><td>$499</td><td><span class="badge bg-warning text-dark">Pending</span></td></tr>
                            <tr><td>3</td><td>Carol</td><td>Tablet</td><td>$349</td><td><span class="badge bg-danger">Cancelled</span></td></tr>
                            <tr><td>4</td><td>Dave</td><td>Watch</td><td>$199</td><td><span class="badge bg-success">Delivered</span></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
