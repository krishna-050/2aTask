<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form - Bootstrap Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">Create Account</h4>
                    </div>
                    <div class="card-body p-4">

                        <form id="signupForm" novalidate>

                            <div class="row g-3">

                                <!-- First Name -->
                                <div class="col-md-6">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-control" required>
                                    <div class="valid-feedback">Looks good!</div>
                                    <div class="invalid-feedback">Enter first name.</div>
                                </div>

                                <!-- Last Name -->
                                <div class="col-md-6">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control" required>
                                    <div class="valid-feedback">Looks good!</div>
                                    <div class="invalid-feedback">Enter last name.</div>
                                </div>

                                <!-- Email -->
                                <div class="col-12">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" required>
                                    <div class="valid-feedback">Valid email!</div>
                                    <div class="invalid-feedback">Enter a valid email.</div>
                                </div>

                                <!-- Password -->
                                <div class="col-12">
                                    <label class="form-label">Password</label>
                                    <input type="password" id="password" class="form-control" minlength="6" required>
                                    <div class="valid-feedback">Strong password!</div>
                                    <div class="invalid-feedback">Min 6 characters required.</div>
                                </div>

                                <!-- Confirm Password -->
                                <div class="col-12">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" id="confirmPassword" class="form-control" required>
                                    <div class="valid-feedback">Passwords match!</div>
                                    <div class="invalid-feedback">Passwords do not match.</div>
                                </div>

                                <!-- Terms -->
                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="terms" required>
                                        <label class="form-check-label" for="terms">
                                            I agree to the <a href="#">Terms & Conditions</a>
                                        </label>
                                        <div class="invalid-feedback">You must agree before submitting.</div>
                                    </div>
                                </div>

                                <!-- Submit -->
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                                </div>

                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('signupForm');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');

            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity('Passwords do not match.');
            } else {
                confirmPassword.setCustomValidity('');
            }

            if (!form.checkValidity()) {
                form.classList.add('was-validated');
            } else {
                alert('Account created successfully!');
                form.reset();
                form.classList.remove('was-validated');
            }
        });
    </script>

</body>
</html>
