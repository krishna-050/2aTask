<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Login Modal</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f2f4f7;
            font-family: Arial, sans-serif;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-btn {
            padding: 12px 30px;
            font-size: 18px;
        }

        .modal-header {
            background-color: #0d6efd;
            color: white;
        }

        .modal-header .btn-close {
            filter: brightness(0) invert(1);
        }

        .login-form label {
            font-weight: bold;
            margin-bottom: 5px;
        }

    </style>
</head>

<body>

    <!-- =========================
         LOGIN BUTTON
         ========================= -->

    <div class="login-container">

        <button
            id="openLoginBtn"
            class="btn btn-primary login-btn">
            Login
        </button>

    </div>


    <!-- =========================
         LOGIN MODAL
         ========================= -->

    <div
        class="modal fade"
        id="loginModal"
        tabindex="-1"
        aria-labelledby="loginModalTitle"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">

                    <h1
                        class="modal-title fs-5"
                        id="loginModalTitle">
                        Login
                    </h1>

                    <button
                        type="button"
                        class="btn-close"
                        id="closeLoginBtn"
                        aria-label="Close">
                    </button>

                </div>


                <!-- Modal Body -->
                <div class="modal-body">

                    <form class="login-form">

                        <!-- Email -->
                        <div class="mb-3">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>

                        </div>


                        <!-- Login -->
                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Login
                        </button>

                    </form>

                </div>


                <!-- Modal Footer -->
                <div class="modal-footer">

                    <button
                        type="button"
                        id="cancelLoginBtn"
                        class="btn btn-secondary">
                        Cancel
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Custom JavaScript -->
    <script>

        // Get the modal element
        const loginModalElement =
            document.getElementById("loginModal");

        // Create Bootstrap Modal object
        const loginModal =
            new bootstrap.Modal(loginModalElement);


        // Open button
        const openLoginBtn =
            document.getElementById("openLoginBtn");

        openLoginBtn.addEventListener("click", function () {

            loginModal.show();

        });


        // Close button
        const closeLoginBtn =
            document.getElementById("closeLoginBtn");

        closeLoginBtn.addEventListener("click", function () {

            loginModal.hide();

        });


        // Cancel button
        const cancelLoginBtn =
            document.getElementById("cancelLoginBtn");

        cancelLoginBtn.addEventListener("click", function () {

            loginModal.hide();

        });

    </script>

</body>

</html>
