<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .carousel-item {
            height: 450px;
        }
        .slide-1 { background: linear-gradient(135deg, #0d6efd, #6610f2); }
        .slide-2 { background: linear-gradient(135deg, #198754, #20c997); }
        .slide-3 { background: linear-gradient(135deg, #dc3545, #fd7e14); }

        .carousel-caption h2 { font-size: 2.5rem; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand fw-bold">MyBrand</span>
    </nav>

    <!-- Carousel -->
    <div id="bannerCarousel" class="carousel slide" data-bs-ride="carousel">

        <!-- Indicators -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="2"></button>
        </div>

        <!-- Slides -->
        <div class="carousel-inner">

            <div class="carousel-item active slide-1 d-flex align-items-center justify-content-center">
                <div class="carousel-caption text-center">
                    <h2>Welcome to MyBrand</h2>
                    <p>Discover amazing products at unbeatable prices.</p>
                    <a href="#" class="btn btn-light btn-lg">Shop Now</a>
                </div>
            </div>

            <div class="carousel-item slide-2 d-flex align-items-center justify-content-center">
                <div class="carousel-caption text-center">
                    <h2>Summer Sale 50% Off</h2>
                    <p>Limited time offer on all premium items.</p>
                    <a href="#" class="btn btn-light btn-lg">Grab Deal</a>
                </div>
            </div>

            <div class="carousel-item slide-3 d-flex align-items-center justify-content-center">
                <div class="carousel-caption text-center">
                    <h2>New Arrivals</h2>
                    <p>Check out the latest collection just for you.</p>
                    <a href="#" class="btn btn-light btn-lg">Explore</a>
                </div>
            </div>

        </div>

        <!-- Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#bannerCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#bannerCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

    <!-- Content below -->
    <div class="container py-5 text-center">
        <h3>Featured Categories</h3>
        <div class="row mt-4 g-3">
            <div class="col-md-4"><div class="card p-4 bg-primary text-white">Electronics</div></div>
            <div class="col-md-4"><div class="card p-4 bg-success text-white">Fashion</div></div>
            <div class="col-md-4"><div class="card p-4 bg-danger text-white">Home & Living</div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
