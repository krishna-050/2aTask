<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q49 - Palindrome Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">
<div class="card shadow p-5 text-center" style="width:440px">
    <h4 class="mb-2">Palindrome Checker</h4>
    <p class="text-muted small mb-4">A palindrome reads the same forwards and backwards.</p>

    <input type="text" id="inp" class="form-control text-center fs-5 mb-3" placeholder="Enter word or sentence" oninput="check()">

    <div id="result" class="mb-4" style="min-height:60px"></div>

    <div id="visual" class="mb-4"></div>

    <hr>
    <p class="fw-bold mb-2">Examples:</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
        <span class="badge bg-success" onclick="setExample('racecar')" style="cursor:pointer">racecar</span>
        <span class="badge bg-success" onclick="setExample('madam')" style="cursor:pointer">madam</span>
        <span class="badge bg-success" onclick="setExample('level')" style="cursor:pointer">level</span>
        <span class="badge bg-danger" onclick="setExample('hello')" style="cursor:pointer">hello</span>
        <span class="badge bg-danger" onclick="setExample('world')" style="cursor:pointer">world</span>
    </div>
</div>

<script>
    function check() {
        const raw = document.getElementById('inp').value;
        const clean = raw.toLowerCase().replace(/[^a-z0-9]/g, '');
        const result = document.getElementById('result');
        const visual = document.getElementById('visual');

        if (!clean) { result.innerHTML = ''; visual.innerHTML = ''; return; }

        const reversed = clean.split('').reverse().join('');
        const isPalin = clean === reversed;

        result.innerHTML = isPalin
            ? `<div class="alert alert-success fs-5">✅ <strong>"${raw}"</strong> is a Palindrome!</div>`
            : `<div class="alert alert-danger fs-5">❌ <strong>"${raw}"</strong> is NOT a Palindrome.</div>`;

        visual.innerHTML =
            `<div class="d-flex justify-content-center gap-1 mb-1">` +
            clean.split('').map((c, i) =>
                `<span class="badge ${clean[i] === reversed[i] ? 'bg-success' : 'bg-danger'} fs-6">${c}</span>`
            ).join('') + `</div>` +
            `<div class="d-flex justify-content-center gap-1">` +
            reversed.split('').map(c => `<span class="badge bg-secondary fs-6">${c}</span>`).join('') +
            `</div><p class="text-muted small mt-1">Original (top) vs Reversed (bottom)</p>`;
    }

    function setExample(word) {
        document.getElementById('inp').value = word;
        check();
    }
</script>
</body>
</html>
