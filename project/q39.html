<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q39 - Debounce Function</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">
<div class="card shadow p-5" style="width:450px">
    <h4 class="text-center mb-2">Custom Debounce — Search Input</h4>
    <p class="text-muted text-center small mb-4">API call fires only after you stop typing for <strong>500ms</strong>.</p>

    <input type="text" id="search" class="form-control form-control-lg mb-3" placeholder="Type to search...">

    <div id="status" class="text-center text-muted mb-3">Waiting for input...</div>
    <div id="log" class="border rounded p-3 bg-white" style="min-height:80px; max-height:160px; overflow-y:auto; font-size:0.85rem;"></div>

    <div class="mt-4 bg-light border rounded p-3">
        <p class="fw-bold mb-1">Debounce Logic:</p>
        <code>
            function debounce(fn, delay) {<br>
            &nbsp;&nbsp;let timer;<br>
            &nbsp;&nbsp;return function(...args) {<br>
            &nbsp;&nbsp;&nbsp;&nbsp;clearTimeout(timer);<br>
            &nbsp;&nbsp;&nbsp;&nbsp;timer = setTimeout(() => fn(...args), delay);<br>
            &nbsp;&nbsp;};<br>
            }
        </code>
    </div>
</div>

<script>
    function debounce(fn, delay) {
        let timer;
        return function(...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn(...args), delay);
        };
    }

    const status = document.getElementById('status');
    const log = document.getElementById('log');

    const search = debounce(function(query) {
        const time = new Date().toLocaleTimeString();
        status.innerHTML = `<span class="badge bg-success">API Called: "${query}"</span>`;
        log.innerHTML += `<div class="text-success">[${time}] Searched: <strong>${query}</strong></div>`;
        log.scrollTop = log.scrollHeight;
    }, 500);

    document.getElementById('search').addEventListener('input', function() {
        status.innerHTML = '<span class="text-warning">⏳ Typing... waiting 500ms</span>';
        search(this.value);
    });
</script>
</body>
</html>
