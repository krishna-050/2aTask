<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q45 - Todo List CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center" style="min-height:100vh; padding-top:60px">
<div class="card shadow p-4" style="width:480px; height:fit-content">
    <h4 class="text-center mb-4">📝 Todo List</h4>

    <div class="input-group mb-3">
        <input type="text" id="input" class="form-control" placeholder="Add a new task...">
        <button class="btn btn-primary" onclick="addTodo()">Add</button>
    </div>

    <div class="d-flex gap-2 mb-3">
        <button class="btn btn-sm btn-outline-secondary" onclick="filter('all')">All</button>
        <button class="btn btn-sm btn-outline-success" onclick="filter('done')">Done</button>
        <button class="btn btn-sm btn-outline-warning" onclick="filter('pending')">Pending</button>
        <span class="ms-auto text-muted small align-self-center" id="count"></span>
    </div>

    <ul class="list-group" id="list"></ul>
</div>

<script>
    let todos = [], editId = null, currentFilter = 'all';

    function addTodo() {
        const val = document.getElementById('input').value.trim();
        if (!val) return;
        if (editId !== null) {
            todos.find(t => t.id === editId).text = val;
            editId = null;
            document.querySelector('#list button.btn-success') && null;
        } else {
            todos.push({ id: Date.now(), text: val, done: false });
        }
        document.getElementById('input').value = '';
        render();
    }

    function toggle(id) {
        const t = todos.find(t => t.id === id);
        t.done = !t.done;
        render();
    }

    function remove(id) {
        todos = todos.filter(t => t.id !== id);
        render();
    }

    function edit(id) {
        const t = todos.find(t => t.id === id);
        document.getElementById('input').value = t.text;
        editId = id;
        document.getElementById('input').focus();
    }

    function filter(type) {
        currentFilter = type;
        render();
    }

    function render() {
        const filtered = todos.filter(t =>
            currentFilter === 'all' ? true :
            currentFilter === 'done' ? t.done : !t.done
        );

        document.getElementById('count').textContent =
            `${todos.filter(t => !t.done).length} pending / ${todos.length} total`;

        document.getElementById('list').innerHTML = filtered.length === 0
            ? '<li class="list-group-item text-center text-muted">No tasks here.</li>'
            : filtered.map(t => `
                <li class="list-group-item d-flex align-items-center gap-2">
                    <input type="checkbox" class="form-check-input" ${t.done ? 'checked' : ''} onchange="toggle(${t.id})">
                    <span class="flex-grow-1 ${t.done ? 'text-decoration-line-through text-muted' : ''}">${t.text}</span>
                    <button class="btn btn-sm btn-outline-warning" onclick="edit(${t.id})">✏️</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="remove(${t.id})">🗑</button>
                </li>`).join('');
    }

    document.getElementById('input').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
    render();
</script>
</body>
</html>
