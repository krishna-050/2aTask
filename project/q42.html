<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q42 - Password Strength Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">
<div class="card shadow p-5" style="width:420px">
    <h4 class="text-center mb-4">Password Strength Checker</h4>

    <div class="input-group mb-3">
        <input type="password" id="pwd" class="form-control" placeholder="Enter password" oninput="check()">
        <button class="btn btn-outline-secondary" onclick="toggle()">👁</button>
    </div>

    <div class="progress mb-2" style="height:10px">
        <div id="bar" class="progress-bar" style="width:0%; transition:width 0.3s"></div>
    </div>
    <p id="label" class="text-center fw-bold mb-4"></p>

    <ul class="list-unstyled small" id="rules">
        <li id="r1">❌ At least 8 characters</li>
        <li id="r2">❌ Uppercase letter (A-Z)</li>
        <li id="r3">❌ Lowercase letter (a-z)</li>
        <li id="r4">❌ Number (0-9)</li>
        <li id="r5">❌ Special character (!@#$...)</li>
    </ul>
</div>

<script>
    const rules = [
        { id: 'r1', test: p => p.length >= 8,          text: 'At least 8 characters' },
        { id: 'r2', test: p => /[A-Z]/.test(p),        text: 'Uppercase letter (A-Z)' },
        { id: 'r3', test: p => /[a-z]/.test(p),        text: 'Lowercase letter (a-z)' },
        { id: 'r4', test: p => /[0-9]/.test(p),        text: 'Number (0-9)' },
        { id: 'r5', test: p => /[^A-Za-z0-9]/.test(p), text: 'Special character (!@#$...)' },
    ];

    const levels = [
        { label: '',        color: '',          pct: 0   },
        { label: 'Weak',    color: 'bg-danger',  pct: 20  },
        { label: 'Fair',    color: 'bg-warning', pct: 40  },
        { label: 'Good',    color: 'bg-info',    pct: 60  },
        { label: 'Strong',  color: 'bg-primary', pct: 80  },
        { label: 'Very Strong', color: 'bg-success', pct: 100 },
    ];

    function check() {
        const p = document.getElementById('pwd').value;
        let score = 0;
        rules.forEach(r => {
            const pass = r.test(p);
            document.getElementById(r.id).textContent = (pass ? '✅' : '❌') + ' ' + r.text;
            if (pass) score++;
        });
        const lvl = p.length === 0 ? levels[0] : levels[score];
        const bar = document.getElementById('bar');
        bar.style.width = lvl.pct + '%';
        bar.className = 'progress-bar ' + lvl.color;
        document.getElementById('label').textContent = lvl.label;
        document.getElementById('label').className = 'text-center fw-bold mb-4 ' +
            (lvl.color.replace('bg-', 'text-') || '');
    }

    function toggle() {
        const i = document.getElementById('pwd');
        i.type = i.type === 'password' ? 'text' : 'password';
    }
</script>
</body>
</html>
