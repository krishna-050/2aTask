<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q38 - Callbacks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">
<div class="card shadow p-5 text-center" style="width:400px">
    <h4 class="mb-2">Callback — Loading Example</h4>
    <p class="text-muted small mb-4">Click the button to simulate async data loading using a callback.</p>

    <button class="btn btn-primary mb-4" id="loadBtn" onclick="loadData()">Load Data</button>

    <div id="status" class="mb-3"></div>
    <div id="result"></div>

    <div class="mt-4 text-start bg-light border rounded p-3">
        <p class="fw-bold mb-1">How Callback Works:</p>
        <code>
            function fetchData(callback) {<br>
            &nbsp;&nbsp;setTimeout(() => callback(data), 2000);<br>
            }
        </code>
    </div>
</div>

<script>
    function fetchData(callback) {
        setTimeout(() => {
            const data = ['Alice — 92', 'Bob — 85', 'Charlie — 78'];
            callback(data);
        }, 2000);
    }

    function loadData() {
        const btn = document.getElementById('loadBtn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');

        btn.disabled = true;
        result.innerHTML = '';
        status.innerHTML = '<div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Loading data...</p>';

        fetchData(function(data) {
            status.innerHTML = '<span class="badge bg-success fs-6">✔ Data Loaded!</span>';
            result.innerHTML = '<ul class="list-group mt-3">' +
                data.map(d => `<li class="list-group-item">${d}</li>`).join('') +
                '</ul>';
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
