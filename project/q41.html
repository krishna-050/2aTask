<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q41 - OTP Timer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">
<div class="card shadow p-5 text-center" style="width:380px">
    <h4 class="mb-2">OTP Verification</h4>
    <p class="text-muted small mb-4">Enter the OTP sent to <strong>+91 98765 XXXXX</strong></p>

    <div class="d-flex justify-content-center gap-2 mb-4">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-box" style="width:50px">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-box" style="width:50px">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-box" style="width:50px">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-box" style="width:50px">
    </div>

    <button class="btn btn-primary w-100 mb-3">Verify OTP</button>

    <div id="timerMsg" class="text-muted small">
        Resend OTP in <span id="countdown" class="fw-bold text-danger">30</span>s
    </div>
    <button id="resendBtn" class="btn btn-link p-0 d-none" onclick="startTimer()">Resend OTP</button>
</div>

<script>
    let timer;

    function startTimer() {
        let sec = 30;
        document.getElementById('resendBtn').classList.add('d-none');
        document.getElementById('timerMsg').classList.remove('d-none');
        document.getElementById('countdown').textContent = sec;

        clearInterval(timer);
        timer = setInterval(() => {
            sec--;
            document.getElementById('countdown').textContent = sec;
            if (sec <= 0) {
                clearInterval(timer);
                document.getElementById('timerMsg').classList.add('d-none');
                document.getElementById('resendBtn').classList.remove('d-none');
            }
        }, 1000);
    }

    // Auto-focus next OTP box
    document.querySelectorAll('.otp-box').forEach((box, i, boxes) => {
        box.addEventListener('input', () => { if (box.value && boxes[i+1]) boxes[i+1].focus(); });
        box.addEventListener('keydown', e => { if (e.key === 'Backspace' && !box.value && boxes[i-1]) boxes[i-1].focus(); });
    });

    startTimer();
</script>
</body>
</html>
