<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q47 - Word & Character Counter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">
<div class="card shadow p-5" style="width:520px">
    <h4 class="text-center mb-4">Word & Character Counter</h4>

    <textarea id="text" class="form-control mb-4" rows="6" placeholder="Start typing here..." oninput="count()"></textarea>

    <div class="row text-center g-3 mb-3">
        <div class="col-6 col-md-3">
            <div class="border rounded p-3">
                <div class="fs-3 fw-bold text-primary" id="chars">0</div>
                <div class="text-muted small">Characters</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="border rounded p-3">
                <div class="fs-3 fw-bold text-success" id="words">0</div>
                <div class="text-muted small">Words</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="border rounded p-3">
                <div class="fs-3 fw-bold text-warning" id="sentences">0</div>
                <div class="text-muted small">Sentences</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="border rounded p-3">
                <div class="fs-3 fw-bold text-danger" id="lines">0</div>
                <div class="text-muted small">Lines</div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary flex-fill" onclick="document.getElementById('text').value=''; count()">Clear</button>
        <button class="btn btn-outline-primary flex-fill" onclick="copyText()">Copy</button>
    </div>
</div>

<script>
    function count() {
        const t = document.getElementById('text').value;
        document.getElementById('chars').textContent = t.length;
        document.getElementById('words').textContent = t.trim() ? t.trim().split(/\s+/).length : 0;
        document.getElementById('sentences').textContent = t.trim() ? t.split(/[.!?]+/).filter(s => s.trim()).length : 0;
        document.getElementById('lines').textContent = t.trim() ? t.split('\n').filter(l => l.trim()).length : 0;
    }

    function copyText() {
        navigator.clipboard.writeText(document.getElementById('text').value);
    }
</script>
</body>
</html>
