<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q37 - Counter App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height:100vh">
<div class="card shadow text-center p-5" style="width:320px">
    <h4 class="mb-4">Counter App</h4>
    <h1 id="count" class="display-1 fw-bold mb-4">0</h1>
    <div class="d-flex gap-2 justify-content-center">
        <button class="btn btn-success btn-lg" onclick="change(1)">+ Increment</button>
        <button class="btn btn-danger btn-lg" onclick="change(-1)">− Decrement</button>
    </div>
    <button class="btn btn-secondary mt-3 w-100" onclick="reset()">↺ Reset</button>
</div>

<script>
    let count = 0;
    const el = document.getElementById('count');

    function change(val) {
        count += val;
        el.textContent = count;
        el.className = 'display-1 fw-bold mb-4 ' + (count > 0 ? 'text-success' : count < 0 ? 'text-danger' : '');
    }

    function reset() {
        count = 0;
        el.textContent = 0;
        el.className = 'display-1 fw-bold mb-4';
    }
</script>
</body>
</html>
