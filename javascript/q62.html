<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q62 - Shopping Cart</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        h2 { text-align: center; }
        .layout { display: flex; gap: 20px; max-width: 850px; margin: 0 auto; flex-wrap: wrap; }
        .products { flex: 1; min-width: 280px; }
        .cart-box { width: 280px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); height: fit-content; }
        h3 { margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card .emoji { font-size: 2.5rem; }
        .card b { display: block; margin: 6px 0 2px; }
        .card .price { color: #4f46e5; font-weight: bold; margin-bottom: 10px; }
        .card button { width: 100%; padding: 8px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .qty { display: flex; align-items: center; gap: 6px; }
        .qty button { width: 26px; height: 26px; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; cursor: pointer; }
        .del { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem; }
        .total { font-weight: bold; text-align: right; margin-top: 10px; }
        .checkout { width: 100%; margin-top: 10px; padding: 10px; background: #22c55e; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .empty { text-align: center; color: #aaa; padding: 15px 0; }
    </style>
</head>
<body>
    <h2>🛒 Shopping Cart</h2>
    <div class="layout">
        <div class="products">
            <h3>Products</h3>
            <div class="grid" id="grid"></div>
        </div>
        <div class="cart-box">
            <h3>Cart (<span id="badge">0</span>)</h3>
            <div id="cartItems"><div class="empty">Cart is empty</div></div>
            <div class="total" id="total"></div>
            <button class="checkout" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <script>
        const products = [
            { id:1, name:'Headphones', emoji:'🎧', price:49 },
            { id:2, name:'Keyboard',   emoji:'⌨️', price:35 },
            { id:3, name:'Mouse',      emoji:'🖱️', price:25 },
            { id:4, name:'Monitor',    emoji:'🖥️', price:199 },
        ];
        let cart = {};

        document.getElementById('grid').innerHTML = products.map(p =>
            `<div class="card">
                <div class="emoji">${p.emoji}</div>
                <b>${p.name}</b>
                <div class="price">$${p.price}</div>
                <button onclick="add(${p.id})">Add to Cart</button>
            </div>`
        ).join('');

        function add(id) { cart[id] = (cart[id] || 0) + 1; render(); }
        function change(id, d) { cart[id] = (cart[id] || 0) + d; if (cart[id] <= 0) delete cart[id]; render(); }

        function render() {
            const keys = Object.keys(cart);
            document.getElementById('badge').textContent = keys.reduce((s,k) => s + cart[k], 0);
            if (!keys.length) { document.getElementById('cartItems').innerHTML = '<div class="empty">Cart is empty</div>'; document.getElementById('total').textContent = ''; return; }
            let total = 0;
            document.getElementById('cartItems').innerHTML = keys.map(id => {
                const p = products.find(x => x.id == id);
                total += p.price * cart[id];
                return `<div class="cart-item">
                    <span>${p.emoji} ${p.name}</span>
                    <div class="qty">
                        <button onclick="change(${id},-1)">−</button>
                        <span>${cart[id]}</span>
                        <button onclick="change(${id},1)">+</button>
                    </div>
                    <button class="del" onclick="change(${id},-cart[${id}])">🗑</button>
                </div>`;
            }).join('');
            document.getElementById('total').textContent = `Total: $${total}`;
        }

        function checkout() {
            if (!Object.keys(cart).length) return alert('Cart is empty!');
            alert('✅ Order placed!');
            cart = {}; render();
        }
    </script>
</body>
</html>
