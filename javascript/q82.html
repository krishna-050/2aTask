<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q82 - API Loader</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; gap: 20px; }
        button { padding: 12px 28px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .spinner { display: none; width: 40px; height: 40px; border: 4px solid #ccc; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .card { background: white; padding: 20px; border-radius: 10px; width: 300px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none; }
        .card img { width: 100%; height: 150px; object-fit: contain; margin-bottom: 10px; }
        .card h3 { font-size: 0.95rem; margin: 0 0 8px; }
        .card .price { color: #4f46e5; font-weight: bold; }
    </style>
</head>
<body>
    <h2>API Loader</h2>
    <button onclick="loadData()">Load Product</button>
    <div class="spinner" id="spinner"></div>
    <div class="card" id="card">
        <img id="img" src="" alt="">
        <h3 id="title"></h3>
        <div class="price" id="price"></div>
    </div>

    <script>
        async function loadData() {
            const spinner = document.getElementById('spinner');
            const card    = document.getElementById('card');

            card.style.display    = 'none';
            spinner.style.display = 'block';

            try {
                const res  = await fetch('https://fakestoreapi.com/products/1');
                const data = await res.json();
                document.getElementById('img').src       = data.image;
                document.getElementById('title').textContent = data.title;
                document.getElementById('price').textContent = '$' + data.price;
                card.style.display = 'block';
            } catch {
                alert('Failed to load!');
            } finally {
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
