<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q55 - Live Search</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 30px; }
        h2 { text-align: center; margin-bottom: 20px; }
        input { display: block; width: 100%; max-width: 450px; margin: 0 auto 20px; padding: 12px; border: 2px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .list { max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .item { background: white; padding: 14px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .item b { color: #333; }
        .item span { color: #888; font-size: 0.85rem; }
        .none { text-align: center; color: #aaa; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Live Search</h2>
    <input type="text" id="search" placeholder="Search by name or city..." oninput="filter()">
    <div class="list" id="list"></div>
    <div class="none" id="none" style="display:none">No results found.</div>

    <script>
        const people = [
            { name: 'Alice Johnson', city: 'New York', job: 'Designer' },
            { name: 'Bob Smith',     city: 'London',   job: 'Developer' },
            { name: 'Carol White',   city: 'Paris',    job: 'Manager' } ,
            { name: 'David Brown',   city: 'Tokyo',    job: 'Tester' },
            { name: 'Eva Green',     city: 'Berlin',   job: 'Analyst' },
            { name: 'Frank Lee',     city: 'Sydney',   job: 'DevOps' },
        ];

        function filter() {
            const q = document.getElementById('search').value.toLowerCase();
            const filtered = people.filter(p => p.name.toLowerCase().includes(q) || p.city.toLowerCase().includes(q));
            document.getElementById('list').innerHTML = filtered.map(p =>
                `<div class="item"><b>${p.name}</b><br><span>${p.city} · ${p.job}</span></div>`
            ).join('');
            document.getElementById('none').style.display = filtered.length ? 'none' : 'block';
        }

        filter();
    </script>
</body>
</html>
