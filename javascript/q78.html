<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q78 - Sort Products</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 30px; }
        h2 { text-align: center; margin-bottom: 20px; }
        .btns { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        button { padding: 9px 20px; border: 2px solid #4f46e5; background: white; color: #4f46e5; border-radius: 25px; cursor: pointer; font-size: 0.95rem; font-weight: bold; }
        button.active { background: #4f46e5; color: white; }
        .products { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 10px; width: 140px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card .emoji { font-size: 2.5rem; margin-bottom: 8px; }
        .card b { display: block; margin-bottom: 5px; }
        .card .price { background: #4f46e5; color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <h2>Sort Products by Price</h2>
    <div class="btns">
        <button onclick="sort('default')" class="active">Default</button>
        <button onclick="sort('low')">Low to High ↑</button>
        <button onclick="sort('high')">High to Low ↓</button>
    </div>
    <div class="products" id="list"></div>

    <script>
        const products = [
            { name: 'Laptop',     price: 75000, emoji: '💻' },
            { name: 'Phone',      price: 25000, emoji: '📱' },
            { name: 'Headphones', price: 3000,  emoji: '🎧' },
            { name: 'Watch',      price: 8000,  emoji: '⌚' },
            { name: 'Tablet',     price: 40000, emoji: '📟' },
            { name: 'Camera',     price: 55000, emoji: '📷' },
        ];

        function sort(order) {
            let sorted = [...products];
            if (order === 'low')  sorted.sort((a, b) => a.price - b.price);
            if (order === 'high') sorted.sort((a, b) => b.price - a.price);
            document.getElementById('list').innerHTML = sorted.map(p =>
                `<div class="card"><div class="emoji">${p.emoji}</div><b>${p.name}</b><span class="price">₹${p.price.toLocaleString()}</span></div>`
            ).join('');
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        sort('default');
    </script>
</body>
</html>
