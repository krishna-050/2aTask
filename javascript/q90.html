<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q90 - API Table</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 30px; }
        h2 { text-align: center; margin-bottom: 20px; }
        .top { display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto 15px; flex-wrap: wrap; gap: 10px; }
        input { padding: 9px 12px; border: 2px solid #ccc; border-radius: 8px; font-size: 0.95rem; width: 220px; }
        input:focus { border-color: #4f46e5; outline: none; }
        .info { color: #888; font-size: 0.9rem; }
        .spinner { text-align: center; color: #888; display: none; margin-bottom: 15px; }
        table { width: 100%; max-width: 800px; margin: 0 auto; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background: #4f46e5; color: white; padding: 12px 15px; text-align: left; font-size: 0.9rem; }
        td { padding: 10px 15px; border-bottom: 1px solid #eee; font-size: 0.85rem; color: #333; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f5f3ff; }
        td img { width: 40px; height: 40px; object-fit: contain; }
        .tag { background: #4f46e5; color: white; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; text-transform: capitalize; }
    </style>
</head>
<body>
    <h2>API Data in Table</h2>
    <div class="top">
        <input type="text" id="search" placeholder="Search products..." oninput="filter()">
        <span class="info" id="info"></span>
    </div>
    <div class="spinner" id="spinner">⏳ Loading...</div>
    <table>
        <thead>
            <tr><th>Image</th><th>Title</th><th>Category</th><th>Price</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>
        let allProducts = [];

        async function init() {
            document.getElementById('spinner').style.display = 'block';
            const res = await fetch('https://fakestoreapi.com/products');
            allProducts = await res.json();
            document.getElementById('spinner').style.display = 'none';
            render(allProducts);
        }

        function filter() {
            const q = document.getElementById('search').value.toLowerCase();
            const filtered = allProducts.filter(p =>
                p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)
            );
            render(filtered);
        }

        function render(products) {
            document.getElementById('info').textContent = `${products.length} products`;
            document.getElementById('tbody').innerHTML = products.map(p => `
                <tr>
                    <td><img src="${p.image}" alt="${p.title}"></td>
                    <td>${p.title.substring(0, 50)}...</td>
                    <td><span class="tag">${p.category}</span></td>
                    <td><b>$${p.price}</b></td>
                </tr>`
            ).join('');
        }

        init();
    </script>
</body>
</html>
