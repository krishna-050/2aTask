<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q77 - Filter Products</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 30px; }
        h2 { text-align: center; margin-bottom: 20px; }
        .btns { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        button { padding: 9px 20px; border: 2px solid #4f46e5; background: white; color: #4f46e5; border-radius: 25px; cursor: pointer; font-size: 0.95rem; font-weight: bold; }
        button.active { background: #4f46e5; color: white; }
        .products { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 10px; width: 140px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card .emoji { font-size: 2.5rem; margin-bottom: 8px; }
        .card b { display: block; margin-bottom: 5px; }
        .card small { background: #4f46e5; color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; }
    </style>
</head>
<body>
    <h2>Filter Products by Category</h2>
    <div class="btns">
        <button onclick="filter('all')" class="active">All</button>
        <button onclick="filter('electronics')">Electronics</button>
        <button onclick="filter('clothing')">Clothing</button>
        <button onclick="filter('food')">Food</button>
    </div>
    <div class="products" id="list"></div>

    <script>
        const products = [
            { name: 'Laptop',  category: 'electronics', emoji: '💻' },
            { name: 'Phone',   category: 'electronics', emoji: '📱' },
            { name: 'T-Shirt', category: 'clothing',    emoji: '👕' },
            { name: 'Jeans',   category: 'clothing',    emoji: '👖' },
            { name: 'Pizza',   category: 'food',        emoji: '🍕' },
            { name: 'Burger',  category: 'food',        emoji: '🍔' },
        ];

        function filter(category) {
            const filtered = category === 'all' ? products : products.filter(p => p.category === category);
            document.getElementById('list').innerHTML = filtered.map(p =>
                `<div class="card"><div class="emoji">${p.emoji}</div><b>${p.name}</b><small>${p.category}</small></div>`
            ).join('');
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        filter('all');
    </script>
</body>
</html>
