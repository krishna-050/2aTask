<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q51 - Modal Popup</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 60px; background: #f0f0f0; }
        button.open { padding: 12px 28px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .overlay.show { display: flex; }
        .modal { background: white; padding: 30px; border-radius: 12px; width: 350px; position: relative; }
        .modal h3 { margin-top: 0; }
        .x { position: absolute; top: 10px; right: 15px; font-size: 1.3rem; cursor: pointer; background: none; border: none; }
        .footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .footer button { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; }
        .cancel { background: #e5e7eb; }
        .confirm { background: #4f46e5; color: white; }
    </style>
</head>
<body>
    <h2>Modal Popup</h2>
    <p>Click the button to open a modal.</p>
    <button class="open" onclick="document.getElementById('overlay').classList.add('show')">Open Modal</button>

    <div class="overlay" id="overlay" onclick="closeModal(event)">
        <div class="modal">
            <button class="x" onclick="close()">✕</button>
            <h3>Modal Title</h3>
            <p>This is a simple modal popup. Close it using the ✕ button, Cancel, or click outside.</p>
            <div class="footer">
                <button class="cancel" onclick="close()">Cancel</button>
                <button class="confirm" onclick="close()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        function close() { document.getElementById('overlay').classList.remove('show'); }
        function closeModal(e) { if (e.target === document.getElementById('overlay')) close(); }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    </script>
</body>
</html>
