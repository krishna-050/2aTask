<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q51 - Modal Popup</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f0f4f8; }
    h2 { color: #333; }
    button.open-btn { padding: 12px 28px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); justify-content: center; align-items: center;
    }
    .overlay.active { display: flex; }
    .modal {
      background: white; padding: 30px 40px; border-radius: 12px;
      max-width: 400px; width: 90%; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .modal h3 { margin-top: 0; color: #4f46e5; }
    .close-btn {
      position: absolute; top: 12px; right: 16px;
      background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #888;
    }
    .close-btn:hover { color: #333; }
    .modal-footer { margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; }
    .modal-footer button { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.95rem; }
    .btn-confirm { background: #4f46e5; color: white; }
    .btn-cancel { background: #e5e7eb; color: #333; }
  </style>
</head>
<body>
  <h2>Q51 - Modal Popup</h2>
  <p>Click the button to open a modal dialog.</p>
  <button class="open-btn" onclick="openModal()">Open Modal</button>

  <div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h3>Modal Title</h3>
      <p>This is a modal popup opened using JavaScript. You can close it by clicking the ✕ button, Cancel, or outside the modal.</p>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" onclick="closeModal()">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    function openModal() { document.getElementById('overlay').classList.add('active'); }
    function closeModal() { document.getElementById('overlay').classList.remove('active'); }
    function handleOverlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
