<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q79 - Product Modal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 30px; }
        h2 { text-align: center; margin-bottom: 25px; }
        .products { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 10px; width: 140px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; }
        .card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .card .emoji { font-size: 2.5rem; margin-bottom: 8px; }
        .card b { display: block; margin-bottom: 5px; }
        .card .price { background: #4f46e5; color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.85rem; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .overlay.show { display: flex; }
        .modal { background: white; padding: 30px; border-radius: 12px; width: 320px; text-align: center; position: relative; }
        .modal .emoji { font-size: 3.5rem; margin-bottom: 10px; }
        .modal h3 { margin: 0 0 5px; }
        .modal .cat { background: #eee; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-block; margin-bottom: 10px; }
        .modal .price { font-size: 1.3rem; color: #4f46e5; font-weight: bold; margin-bottom: 8px; }
        .modal .desc { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .modal button { padding: 10px 30px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .x { position: absolute; top: 12px; right: 16px; font-size: 1.3rem; cursor: pointer; background: none; border: none; color: #888; }
    </style>
</head>
<body>
    <h2>Product Details</h2>
    <div class="products" id="list"></div>

    <div class="overlay" id="overlay" onclick="closeModal(event)">
        <div class="modal">
            <button class="x" onclick="close()">✕</button>
            <div class="emoji" id="mEmoji"></div>
            <h3 id="mName"></h3>
            <span class="cat" id="mCat"></span>
            <div class="price" id="mPrice"></div>
            <p class="desc" id="mDesc"></p>
            <button onclick="close()">Close</button>
        </div>
    </div>

    <script>
        const products = [
            { name: 'Laptop',     category: 'electronics', price: 75000, emoji: '💻', desc: 'High performance laptop with 16GB RAM.' },
            { name: 'Phone',      category: 'electronics', price: 25000, emoji: '📱', desc: 'Smartphone with 108MP camera.' },
            { name: 'Headphones', category: 'electronics', price: 3000,  emoji: '🎧', desc: 'Noise cancelling wireless headphones.' },
            { name: 'Watch',      category: 'accessories', price: 8000,  emoji: '⌚', desc: 'Smart watch with health tracking.' },
        ];

        document.getElementById('list').innerHTML = products.map((p, i) =>
            `<div class="card" onclick="open(${i})">
                <div class="emoji">${p.emoji}</div>
                <b>${p.name}</b>
                <span class="price">₹${p.price.toLocaleString()}</span>
            </div>`
        ).join('');

        function open(i) {
            const p = products[i];
            document.getElementById('mEmoji').textContent  = p.emoji;
            document.getElementById('mName').textContent   = p.name;
            document.getElementById('mCat').textContent    = p.category;
            document.getElementById('mPrice').textContent  = '₹' + p.price.toLocaleString();
            document.getElementById('mDesc').textContent   = p.desc;
            document.getElementById('overlay').classList.add('show');
        }

        function close() { document.getElementById('overlay').classList.remove('show'); }
        function closeModal(e) { if (e.target === document.getElementById('overlay')) close(); }
    </script>
</body>
</html>
