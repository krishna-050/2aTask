<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q83 - Error Handling</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; gap: 15px; }
        .row { display: flex; gap: 10px; }
        input { padding: 10px; border: 2px solid #ccc; border-radius: 8px; font-size: 1rem; width: 200px; }
        button { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .spinner { display: none; width: 35px; height: 35px; border: 4px solid #ccc; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .box { background: white; padding: 20px; border-radius: 10px; width: 320px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none; }
        .box img { width: 100%; height: 150px; object-fit: contain; margin-bottom: 10px; }
        .box h3 { font-size: 0.95rem; margin: 0 0 8px; }
        .box .price { color: #4f46e5; font-weight: bold; }
        .error { background: #fee2e2; color: #dc2626; padding: 12px 20px; border-radius: 8px; display: none; width: 320px; text-align: center; }
        small { color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>
    <h2>Error Handling</h2>
    <small>Enter product ID (1-20). Try invalid ID to see error.</small>
    <div class="row">
        <input type="number" id="pid" placeholder="Product ID (1-20)" min="1">
        <button onclick="load()">Fetch</button>
    </div>
    <div class="spinner" id="spinner"></div>
    <div class="error" id="error"></div>
    <div class="box" id="box">
        <img id="img" src="" alt="">
        <h3 id="title"></h3>
        <div class="price" id="price"></div>
    </div>

    <script>
        async function load() {
            const id      = document.getElementById('pid').value;
            const spinner = document.getElementById('spinner');
            const error   = document.getElementById('error');
            const box     = document.getElementById('box');

            error.style.display = 'none';
            box.style.display   = 'none';
            spinner.style.display = 'block';

            try {
                if (!id) throw new Error('Please enter a product ID.');
                const res  = await fetch(`https://fakestoreapi.com/products/${id}`);
                if (!res.ok) throw new Error(`Error ${res.status}: Product not found.`);
                const data = await res.json();
                if (!data || !data.title) throw new Error('No product found for this ID.');
                document.getElementById('img').src            = data.image;
                document.getElementById('title').textContent  = data.title;
                document.getElementById('price').textContent  = '$' + data.price;
                box.style.display = 'block';
            } catch (err) {
                error.textContent   = '❌ ' + err.message;
                error.style.display = 'block';
            } finally {
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
