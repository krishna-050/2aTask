<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8">
    <title>Q81 - Fetch API</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 30px; }
        h2 { text-align: center; margin-bottom: 5px; }
        p.sub { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.9rem; }
        .btns { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        button { padding: 9px 20px; border: 2px solid #4f46e5; background: white; color: #4f46e5; border-radius: 25px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        button.active { background: #4f46e5; color: white; }
        .loader { text-align: center; color: #888; display: none; margin-bottom: 15px; }
        .error  { text-align: center; color: #ef4444; display: none; margin-bottom: 15px; }
        .cards { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .card { background: white; border-radius: 10px; width: 200px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-body { padding: 12px; }
        .card-body h3 { font-size: 0.85rem; margin: 0 0 8px; color: #333; }
        .card-body .tag { background: #4f46e5; color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; text-transform: capitalize; }
    </style>
</head>
<body>
    <h2>Fetch API Products</h2>
    <p class="sub">Data from FakeStoreAPI</p>
    <div class="btns">
        <button onclick="load('all')" class="active">All</button>
        <button onclick="load('electronics')">Electronics</button>
        <button onclick="load('jewelery')">Jewelery</button>
        <button onclick="load(`men's clothing`)">Men's</button>
        <button onclick="load(`women's clothing`)">Women's</button>
    </div>
    <p class="loader" id="loader">⏳ Loading...</p>
    <p class="error"  id="error">❌ Failed to load. Try again.</p>
    <div class="cards" id="cards"></div>

    <script>
        async function load(category) {
            const loader = document.getElementById('loader');
            const error  = document.getElementById('error');
            const cards  = document.getElementById('cards');

            loader.style.display = 'block';
            error.style.display  = 'none';
            cards.innerHTML = '';

            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            try {
                const url = category === 'all'
                    ? 'https://fakestoreapi.com/products'
                    : `https://fakestoreapi.com/products/category/${encodeURIComponent(category)}`;
                const res  = await fetch(url);
                const data = await res.json();
                cards.innerHTML = data.map(p => `
                    <div class="card">
                        <img src="${p.image}" alt="${p.title}">
                        <div class="card-body">
                            <h3>${p.title.substring(0, 50)}...</h3>
                            <span class="tag">${p.category}</span>
                        </div>
                    </div>`
                ).join('');
            } catch {
                error.style.display = 'block';
            } finally {
                loader.style.display = 'none';
            }
        }

        load('all');
    </script>
</body>
</html>
