<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q61 - Custom Dropdown</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; gap: 20px; }
        h2 { margin: 0; }
        .dropdown { position: relative; width: 260px; }
        .selected { display: flex; justify-content: space-between; padding: 12px 16px; background: white; border: 2px solid #ccc; border-radius: 10px; cursor: pointer; }
        .dropdown.open .selected { border-color: #4f46e5; }
        .menu { display: none; position: absolute; top: calc(100% + 5px); left: 0; right: 0; background: white; border: 2px solid #ccc; border-radius: 10px; z-index: 10; }
        .dropdown.open .menu { display: block; }
        .option { padding: 11px 16px; cursor: pointer; }
        .option:hover { background: #f5f3ff; }
        .option.active { background: #ede9fe; color: #4f46e5; font-weight: bold; }
        #result { font-size: 1rem; color: #555; }
    </style>
</head>
<body>
    <h2>Custom Dropdown</h2>
    <div class="dropdown" id="dd">
        <div class="selected" onclick="document.getElementById('dd').classList.toggle('open')">
            <span id="selectedText">🌍 Select Country</span>
            <span>▼</span>
        </div>
        <div class="menu">
            <div class="option" onclick="select(this)">🇮🇳 India</div>
            <div class="option" onclick="select(this)">🇺🇸 United States</div>
            <div class="option" onclick="select(this)">🇬🇧 United Kingdom</div>
            <div class="option" onclick="select(this)">🇯🇵 Japan</div>
            <div class="option" onclick="select(this)">🇩🇪 Germany</div>
        </div>
    </div>
    <div id="result">No country selected.</div>

    <script>
        function select(el) {
            document.querySelectorAll('.option').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('selectedText').textContent = el.textContent;
            document.getElementById('result').textContent = `✅ Selected: ${el.textContent.trim()}`;
            document.getElementById('dd').classList.remove('open');
        }

        document.addEventListener('click', e => {
            if (!document.getElementById('dd').contains(e.target))
                document.getElementById('dd').classList.remove('open');
        });
    </script>
</body>
</html>
