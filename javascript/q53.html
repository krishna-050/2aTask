<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q53 - Event Delegation</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 30px; text-align: center; }
        h2 { margin-bottom: 5px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        #container { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .card { background: white; padding: 20px 25px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card:hover { border-color: #4f46e5; }
        .card.selected { background: #4f46e5; color: white; }
        .card .icon { font-size: 2rem; }
        #result { font-size: 1.1rem; color: #333; }
    </style>
</head>
<body>
    <h2>Event Delegation</h2>
    <p>One listener on the parent handles all card clicks.</p>

    <div id="container">
        <div class="card" data-name="Alice" data-role="Designer"><div class="icon">👩‍🎨</div>Alice</div>
        <div class="card" data-name="Bob"   data-role="Developer"><div class="icon">👨‍💻</div>Bob</div>
        <div class="card" data-name="Carol" data-role="Manager"><div class="icon">👩‍💼</div>Carol</div>
        <div class="card" data-name="Dave"  data-role="Tester"><div class="icon">🧪</div>Dave</div>
    </div>

    <div id="result">Click a card!</div>

    <script>
        document.getElementById('container').addEventListener('click', function(e) {
            const card = e.target.closest('.card');
            if (!card) return;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            document.getElementById('result').textContent = `✅ ${card.dataset.name} — ${card.dataset.role}`;
        });
    </script>
</body>
</html>
