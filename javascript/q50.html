<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q50 - Memory Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f0f0; padding: 30px; }
        h2 { margin-bottom: 10px; }
        p { margin-bottom: 15px; color: #555; }
        #board { display: grid; grid-template-columns: repeat(4, 90px); gap: 10px; justify-content: center; margin-bottom: 20px; }
        .card { width: 90px; height: 90px; background: #4f46e5; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; color: transparent; }
        .card.flipped { background: white; color: black; border: 2px solid #4f46e5; }
        .card.matched { background: #22c55e; color: white; cursor: default; }
        button { padding: 10px 25px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>
    <h2>Memory Game</h2>
    <p>Moves: <b id="moves">0</b> | Matches: <b id="matches">0</b>/8</p>
    <div id="board"></div>
    <button onclick="initGame()">Restart</button>

    <script>
        const emojis = ['🍎','🍌','🍇','🍓','🍒','🥝','🍑','🍍'];
        let cards = [], flipped = [], moves = 0, matches = 0, lock = false;

        function initGame() {
            cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
            flipped = []; moves = 0; matches = 0; lock = false;
            document.getElementById('moves').textContent = 0;
            document.getElementById('matches').textContent = 0;
            const board = document.getElementById('board');
            board.innerHTML = '';
            cards.forEach((emoji, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.emoji = emoji;
                card.textContent = emoji;
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lock || this.classList.contains('flipped') || this.classList.contains('matched')) return;
            this.classList.add('flipped');
            flipped.push(this);
            if (flipped.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                lock = true;
                if (flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
                    flipped.forEach(c => c.classList.add('matched'));
                    matches++;
                    document.getElementById('matches').textContent = matches;
                    if (matches === 8) setTimeout(() => alert(`🎉 You won in ${moves} moves!`), 300);
                    flipped = []; lock = false;
                } else {
                    setTimeout(() => {
                        flipped.forEach(c => c.classList.remove('flipped'));
                        flipped = []; lock = false;
                    }, 900);
                }
            }
        }

        initGame();
    </script>
</body>
</html>
