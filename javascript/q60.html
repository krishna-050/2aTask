<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q60 - Star Rating</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: white; padding: 40px; border-radius: 14px; width: 380px; box-shadow: 0 6px 25px rgba(0,0,0,0.12); text-align: center; }
    h2 { color: #4f46e5; margin-top: 0; }
    .product-img { font-size: 4rem; margin: 10px 0; }
    .product-name { font-size: 1.2rem; font-weight: bold; color: #333; }
    .stars { display: flex; justify-content: center; gap: 8px; margin: 20px 0 10px; }
    .star { font-size: 2.5rem; cursor: pointer; transition: transform 0.15s; color: #d1d5db; }
    .star.hovered, .star.selected { color: #f59e0b; }
    .star:hover { transform: scale(1.2); }
    #ratingText { font-size: 1rem; color: #555; min-height: 24px; margin-bottom: 15px; }
    button { padding: 10px 28px; background: #4f46e5; color: white; border: none; border-radius: 9px; cursor: pointer; font-size: 1rem; }
    button:disabled { background: #c4b5fd; cursor: default; }
    #feedback { margin-top: 15px; font-size: 0.95rem; color: #22c55e; min-height: 20px; }
    .avg { margin-top: 20px; padding-top: 15px; border-top: 1px solid #f0f0f0; font-size: 0.9rem; color: #888; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Q60 - Star Rating</h2>
    <div class="product-img">🎧</div>
    <div class="product-name">Wireless Headphones</div>
    <div class="stars" id="stars">
      <span class="star" data-val="1">★</span>
      <span class="star" data-val="2">★</span>
      <span class="star" data-val="3">★</span>
      <span class="star" data-val="4">★</span>
      <span class="star" data-val="5">★</span>
    </div>
    <div id="ratingText">Click a star to rate</div>
    <button id="submitBtn" onclick="submitRating()" disabled>Submit Rating</button>
    <div id="feedback"></div>
    <div class="avg" id="avgDiv"></div>
  </div>

  <script>
    const labels = ['', 'Terrible 😞', 'Poor 😕', 'Okay 😐', 'Good 😊', 'Excellent 🤩'];
    const stars = document.querySelectorAll('.star');
    let selected = 0, ratings = [];

    stars.forEach(star => {
      star.addEventListener('mouseover', () => highlightStars(+star.dataset.val));
      star.addEventListener('mouseout', () => highlightStars(selected));
      star.addEventListener('click', () => {
        selected = +star.dataset.val;
        highlightStars(selected);
        document.getElementById('ratingText').textContent = `You selected: ${selected}/5 — ${labels[selected]}`;
        document.getElementById('submitBtn').disabled = false;
      });
    });

    function highlightStars(val) {
      stars.forEach(s => {
        s.classList.toggle('hovered', +s.dataset.val <= val && val !== selected);
        s.classList.toggle('selected', +s.dataset.val <= val && val === selected);
      });
    }

    function submitRating() {
      ratings.push(selected);
      const avg = (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1);
      document.getElementById('feedback').textContent = `✅ Thanks for your ${selected}-star rating!`;
      document.getElementById('avgDiv').textContent = `Average rating: ⭐ ${avg} (${ratings.length} review${ratings.length > 1 ? 's' : ''})`;
      document.getElementById('submitBtn').disabled = true;
      selected = 0; highlightStars(0);
      document.getElementById('ratingText').textContent = 'Click a star to rate again';
    }
  </script>
</body>
</html>
