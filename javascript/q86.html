<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q86 - API Search</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 30px; }
        h2 { text-align: center; margin-bottom: 20px; }
        input { display: block; width: 100%; max-width: 450px; margin: 0 auto 20px; padding: 12px; border: 2px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        input:focus { border-color: #4f46e5; outline: none; }
        .info { text-align: center; color: #888; margin-bottom: 15px; font-size: 0.9rem; }
        .cards { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .card { background: white; border-radius: 10px; width: 180px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 130px; object-fit: contain; padding: 10px; }
        .card-body { padding: 10px; }
        .card-body h3 { font-size: 0.8rem; margin: 0 0 5px; color: #333; }
        .card-body .price { color: #4f46e5; font-weight: bold; }
        .none { text-align: center; color: #aaa; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>API Search</h2>
    <input type="text" id="search" placeholder="Search products..." oninput="search()">
    <div class="info" id="info"></div>
    <div class="cards" id="cards"></div>
    <div class="none" id="none" style="display:none">No products found.</div>

    <script>
        let allProducts = [];

        async function init() {
            const res = await fetch('https://fakestoreapi.com/products');
            allProducts = await res.json();
            render(allProducts);
        }

        function search() {
            const q = document.getElementById('search').value.toLowerCase();
            const filtered = allProducts.filter(p =>
                p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)
            );
            render(filtered);
        }

        function render(products) {
            document.getElementById('info').textContent = `Showing ${products.length} of ${allProducts.length} products`;
            document.getElementById('none').style.display = products.length ? 'none' : 'block';
            document.getElementById('cards').innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.image}" alt="${p.title}">
                    <div class="card-body">
                        <h3>${p.title.substring(0, 40)}...</h3>
                        <div class="price">$${p.price}</div>
                    </div>
                </div>`
            ).join('');
        }

        init();
    </script>
</body>
</html>
