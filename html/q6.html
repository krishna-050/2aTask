<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Dashboard</title>
</head>

<body>

    <h1>Student Marks Dashboard</h1>

    <table border="1">

        <!-- Table Title -->
        <caption>Student Marks Report</caption>

        <!-- Table Heading -->
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Java</th>
                <th>HTML</th>
                <th>CSS</th>
                <th>Total</th>
            </tr>
        </thead>

        <!-- Student Data -->
        <tbody>
            <tr>
                <td>Rahul</td>
                <td>80</td>
                <td>85</td>
                <td>75</td>
                <td>240</td>
            </tr>

            <tr>
                <td>Aman</td>
                <td>70</td>
                <td>90</td>
                <td>80</td>
                <td>240</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>95</td>
                <td>88</td>
                <td>92</td>
                <td>275</td>
            </tr>
        </tbody>

        <!-- Table Summary -->
        <tfoot>
            <tr>
                <th colspan="4">Class Total</th>
                <th>755</th>
            </tr>
        </tfoot>

    </table>

</body>
</html>
