<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glassmorphism Login</title>

    <style>

        /* Whole Page */
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }


        /* Glass Card */
        .login-card {
            width: 320px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.15);

            border: 1px solid rgba(255, 255, 255, 0.3);

            backdrop-filter: blur(15px);

            border-radius: 15px;

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);

            color: white;
        }


        /* Heading */
        .login-card h1 {
            text-align: center;
            margin-bottom: 30px;
        }


        /* Labels */
        label {
            display: block;
            margin-bottom: 8px;
        }


        /* Input Fields */
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;

            box-sizing: border-box;

            border: 1px solid rgba(255, 255, 255, 0.4);

            border-radius: 8px;

            background: rgba(255, 255, 255, 0.1);

            color: white;

            outline: none;
        }


        /* Placeholder */
        input::placeholder {
            color: #dddddd;
        }


        /* Login Button */
        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background-color: white;
            color: #764ba2;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        /* Button Hover */
        button:hover {
            transform: scale(1.03);
        }

    </style>

</head>

<body>

    <!-- Login Card -->
    <div class="login-card">

        <h1>Welcome Back</h1>

        <form>

            <label for="email">Email</label>

            <input 
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">Password</label>

            <input 
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
