<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard using CSS Grid</title>

    <style>
        *{
            margin: 0;
        }
        /* Whole Dashboard */
        .dashboard {
            display: grid;

            grid-template-columns: 200px 1fr;

            grid-template-rows: 70px 1fr;

            min-height: 100vh;

            font-family: Arial, sans-serif;
        }


        /* Sidebar */
        .sidebar {
            background-color: #222;
            color: white;
            padding: 20px;

            grid-row: 1 / 3;
        }


        .sidebar h2 {
            margin-bottom: 20px;
        }


        .sidebar p {
            padding: 10px;
        }


        /* Header */
        .header {
            background-color: #eeeeee;
            padding: 20px;
        }


        /* Main Content */
        .main {
            background-color: #f5f5f5;
            padding: 30px;
        }


        /* Cards */
        .cards {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }


        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 10px #aaa;
        }
        

    </style>

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>Dashboard</h2>

            <p>Home</p>
            <p>Students</p>
            <p>Courses</p>
            <p>Settings</p>

        </aside>


        <!-- Header -->
        <header class="header">

            <h2>Student Dashboard</h2>

        </header>


        <!-- Main Content -->
        <main class="main">

            <h1>Overview</h1>

            <div class="cards">

                <div class="card">
                    <h2>Students</h2>
                    <p>500</p>
                </div>

                <div class="card">
                    <h2>Courses</h2>
                    <p>25</p>
                </div>

                <div class="card">
                    <h2>Teachers</h2>
                    <p>40</p>
                </div>

            </div>

        </main>

    </div>

</body>

</html>
