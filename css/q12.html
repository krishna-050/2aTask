<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Transitions</title>

    <style>

        /* Basic Page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }


        /* Card */
        .card {
            width: 300px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;

            /* Smooth transition */
            transition: transform 0.3s, box-shadow 0.3s;
        }


        /* Card Hover */
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px #999;
        }


        /* Button */
        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;

            /* Smooth transition */
            transition: background-color 0.3s, transform 0.3s;
        }


        /* Button Hover */
        button:hover {
            background-color: darkblue;
            transform: scale(3.4);
        }

    </style>
</head>

<body>

    <div class="card">

        <h2>Welcome!</h2>

        <p>
            Move your mouse over this card
            to see the transition.
        </p>

        <button>Click Me</button>

    </div>

</body>
</html>
